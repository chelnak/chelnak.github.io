<svg xmlns="http://www.w3.org/2000/svg" width="600" height="610" viewBox="0 0 600 610" role="img" aria-labelledby="title desc">
  <title id="title">Check the reply budget before taking a reference</title>
  <desc id="desc">For an entry that will not fit, the old path takes a lookup reference then omits the entry. The fixed path checks the size first and stops without taking a reference.</desc>
  <rect width="600" height="610" rx="12" fill="#f6f8fa"/>
  <g font-family="system-ui, sans-serif" fill="#243447" text-anchor="middle">
    <text x="300" y="38" font-size="21" font-weight="700">An entry that won't fit in the reply</text>
    <rect x="24" y="60" width="552" height="252" rx="10" fill="#fff" stroke="#c65b53" stroke-width="2"/>
    <text x="300" y="94" font-size="20" font-weight="700">Before</text>
    <text x="300" y="133" font-size="20">Lookup takes a reference</text>
    <path d="M300 147v24m-6-6 6 6 6-6" fill="none" stroke="#52616b" stroke-width="2"/>
    <text x="300" y="201" font-size="20">Reply builder omits the entry</text>
    <path d="M300 215v24m-6-6 6 6 6-6" fill="none" stroke="#52616b" stroke-width="2"/>
    <text x="300" y="271" font-size="20" font-weight="700" fill="#9d302b">Reference left behind</text>
    <rect x="24" y="334" width="552" height="252" rx="10" fill="#fff" stroke="#2d8270" stroke-width="2"/>
    <text x="300" y="368" font-size="20" font-weight="700">After</text>
    <text x="300" y="407" font-size="20">Check size: entry won't fit</text>
    <path d="M300 421v24m-6-6 6 6 6-6" fill="none" stroke="#52616b" stroke-width="2"/>
    <text x="300" y="475" font-size="20">Stop building this reply</text>
    <path d="M300 489v24m-6-6 6 6 6-6" fill="none" stroke="#52616b" stroke-width="2"/>
    <text x="300" y="545" font-size="20" font-weight="700" fill="#216757">No lookup reference taken</text>
  </g>
</svg>
